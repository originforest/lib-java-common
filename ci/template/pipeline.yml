###############################
# var_soruces
###############################
var_sources:
- name: my-vault
  type: dummy
  config:
    vars:
      ci:
        resource-webhook-token: ((resource-webhook-token))
        registry-url: ((registry-url))
        registry-url-internal: ((registry-url-internal))
        registry-username: ((registry-username))
        registry-password: ((registry-password))
        registry-mirror: ((registry-mirror))
        nexus-username: ((nexus-username))
        nexus-password: ((nexus-password))
        nexus-url: ((nexus-url))
        k8s-url: ((k8s-url))
        k8s-ca-base64: ((k8s-ca-base64))
        k8s-ca: ((k8s-ca))
        k8s-admin-cert-base64: ((k8s-admin-cert-base64))
        k8s-admin-cert: ((k8s-admin-cert))
        k8s-admin-key-base64: ((k8s-admin-key-base64))
        k8s-admin-key: ((k8s-admin-key))
        k8s-token: ((k8s-token))

###############################
# reference.
###############################

# registry mirror 用于拉取共用镜像.
registry-source-public: &registry-source-public
  registry_mirror: http://((registry_mirror))/
  official_registry: ((registry_mirror))
# registry private 用于私仓.
registry-source-private: &registry-source-private
  username: ((my-vault:ci.registry-username))
  password: ((my-vault:ci.registry-password))
  insecure_registries: 
  - ((my-vault:ci.registry-url-internal))
  official_registry: ((registry_mirror))
# 传递给 task的registry信息.
registry-var: &registry-var
  registry-url: ((my-vault:ci.registry-url))
  registry-url-internal: ((my-vault:ci.registry-url-internal))
  registry-username: ((my-vault:ci.registry-username))
  registry-password: ((my-vault:ci.registry-password))
  registry-mirror: http://((registry_mirror))/
nexus-var: &nexus-var
  nexus-url: ((my-vault:ci.nexus-url))/repository/bpfaas-group/
  nexus-snapshotUrl: ((my-vault:ci.nexus-url))/repository/bpfaas-snapshot/
  nexus-username: ((my-vault:ci.nexus-username))
  nexus-password: ((my-vault:ci.nexus-password))

###############################
# resource types.
###############################
resource_types:
- name: fly
  type: docker-image
  source:
    <<: *registry-source-private
    repository: ((my-vault:ci.registry-url-internal))/concourse-fly-resource
    tag: 2.0.1

###############################
# resources.
###############################
resources:
# 项目源码.
- name: source
  type: git
  icon: gitlab
  check_every: 9999h
  webhook_token: ((my-vault:ci.resource-webhook-token))
  source:
    branch: ((profile))
    uri: git@git.bpfaas.com:bpfaas/platform-lib/lib-java-common.git
    private_key: ((git-privateKey))
    fetch_tags: true

###############################
# jobs.
###############################
jobs:
- name: build
  interruptible: true # 允许立即abort
  plan:
  # 获取代码.
  - get: source
    timeout: ((step-timeout))
    trigger: true
  # 编译.
  - task: build
    timeout: ((task-timeout))
    file: source/ci/template/task-build.yml
    vars:
      <<: *registry-var
      <<: *nexus-var
